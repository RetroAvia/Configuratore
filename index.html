<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />
    <meta
      name="description"
      content="Personalizza il quadrante del tuo Casio F-91W (e presto altri prodotti) con una tua immagine: carica, posiziona, ruota e scarica il risultato. Tutto nel browser, gratis."
    />
    <title>Configuratore — Personalizza i tuoi prodotti</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Supporto per URL "puliti" (client-side routing) su GitHub Pages.
      GitHub Pages è un hosting statico e non sa reindirizzare le rotte
      dell'app (es. /orologi/casio-f91w) verso index.html: il file
      public/404.html intercetta quelle richieste e le codifica in una
      query string; questo script, eseguito all'avvio, la decodifica e
      ripristina l'URL originale tramite la History API.
      Tecnica: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
