<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120e0c" />
    <meta
      name="description"
      content="RetroAvia Lab: personalizza orologi digitali Casio e console portatili Nintendo con una tua immagine. Carica, posiziona, ruota e scarica il risultato — tutto nel browser, gratis."
    />
    <title>RetroAvia Lab — Personalizza i tuoi prodotti</title>

    <!--
      Indirizzo canonico: dichiara ai motori di ricerca qual è l'URL
      "ufficiale" di questa pagina. Viene riscritto per ogni rotta dalle
      pagine statiche generate al momento della build (vedi il plugin
      `seoStaticPages` in vite.config.ts) e aggiornato durante la navigazione
      da `usePageMeta`.
    -->
    <link rel="canonical" href="https://configuratore-five.vercel.app/" />

    <!--
      Open Graph / Twitter Card: l'anteprima mostrata quando un link del sito
      viene condiviso su Instagram, WhatsApp, Telegram o via email.

      I valori qui sotto sono quelli della home. Ogni altra rotta ha la
      PROPRIA copia statica di questo file, con titolo, descrizione e
      immagine del prodotto già scritti dentro: i bot che generano le
      anteprime non eseguono JavaScript, quindi è l'unico modo perché il link
      di un singolo prodotto mostri quel prodotto invece della home.
      Vedi il plugin `seoStaticPages` in vite.config.ts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RetroAvia Lab" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="RetroAvia Lab — Personalizza i tuoi prodotti" />
    <meta
      property="og:description"
      content="Personalizza orologi digitali Casio e console portatili Nintendo con una tua immagine: gratis, veloce e senza installare nulla."
    />
    <meta property="og:image" content="https://configuratore-five.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://configuratore-five.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RetroAvia Lab — Personalizza i tuoi prodotti" />
    <meta
      name="twitter:description"
      content="Personalizza orologi digitali Casio e console portatili Nintendo con una tua immagine: gratis, veloce e senza installare nulla."
    />
    <meta name="twitter:image" content="https://configuratore-five.vercel.app/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Vercel Web Analytics: statistiche di visita rispettose della privacy
      (nessun cookie), per capire quante persone visitano il sito e da dove
      arrivano. Per iniziare a raccogliere dati va anche attivata una volta
      sola la voce "Analytics" nelle impostazioni del progetto su Vercel.
    -->
    <script src="/vercel-analytics-init.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
