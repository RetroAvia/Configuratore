<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120e0c" />
    <meta
      name="description"
      content="RetroAvia Lab: personalizza orologi digitali Casio e console portatili Nintendo con una tua immagine. Carica, posiziona, ruota e scarica il risultato — tutto nel browser, gratis."
    />
    <title>RetroAvia Lab — Personalizza i tuoi prodotti</title>

    <!--
      Open Graph / Twitter Card: anteprima statica mostrata quando un link
      del sito viene condiviso su Instagram, WhatsApp, email, ecc. Essendo
      un'app 100% client-side (senza server che genera pagine su misura),
      questa anteprima è sempre la stessa per qualunque pagina del sito —
      non cambia in base al prodotto aperto. È comunque molto meglio di
      nessuna anteprima, che è la situazione attuale.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RetroAvia Lab" />
    <meta property="og:title" content="RetroAvia Lab — Personalizza i tuoi prodotti" />
    <meta
      property="og:description"
      content="Personalizza orologi digitali Casio e console portatili Nintendo con una tua immagine: gratis, veloce e senza installare nulla."
    />
    <meta property="og:image" content="https://configuratore-five.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://configuratore-five.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RetroAvia Lab — Personalizza i tuoi prodotti" />
    <meta
      name="twitter:description"
      content="Personalizza orologi digitali Casio e console portatili Nintendo con una tua immagine: gratis, veloce e senza installare nulla."
    />
    <meta name="twitter:image" content="https://configuratore-five.vercel.app/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Supporto per URL "puliti" (client-side routing) su GitHub Pages.
      GitHub Pages è un hosting statico e non sa reindirizzare le rotte
      dell'app (es. /orologi/casio-f91w) verso index.html: il file
      public/404.html intercetta quelle richieste e le codifica in una
      query string; questo script, eseguito all'avvio, la decodifica e
      ripristina l'URL originale tramite la History API.
      Tecnica: https://github.com/rafgraph/spa-github-pages
    -->
    <script src="/spa-redirect.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Vercel Web Analytics: statistiche di visita rispettose della privacy
      (nessun cookie), per capire quante persone visitano il sito e da dove
      arrivano. Per iniziare a raccogliere dati va anche attivata una volta
      sola la voce "Analytics" nelle impostazioni del progetto su Vercel.
    -->
    <script src="/vercel-analytics-init.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
