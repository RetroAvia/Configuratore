<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Pagina non trovata — RetroAvia Lab</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #120e0c;
        color: #f6efe4;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #b9a996; margin: 0 0 24px; }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 12px;
        background: linear-gradient(90deg, #c1272d, #e8b04b);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!--
      Pagina mostrata dall'hosting per un indirizzo inesistente.

      In condizioni normali non viene quasi mai raggiunta: su Vercel la regola
      di riscrittura in vercel.json manda ogni percorso all'applicazione, che
      gestisce da sé la schermata "pagina non trovata" (tradotta nelle quattro
      lingue del sito). Questa resta come rete di sicurezza per i casi in cui
      l'applicazione non venga avviata affatto.

      Sostituisce il vecchio file, che conteneva il meccanismo di
      reindirizzamento richiesto da GitHub Pages: il sito è pubblicato su
      Vercel, dove quel meccanismo non serve e rischiava solo di mandare i
      visitatori su indirizzi storpiati.
    -->
    <main>
      <h1>Pagina non trovata</h1>
      <p>L’indirizzo che hai aperto non esiste (o non esiste più).</p>
      <a href="/">Torna alla home</a>
    </main>
  </body>
</html>
